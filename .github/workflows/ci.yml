name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly vulnerability scan

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # Python Backend Code Quality
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install bandit autoflake
    
    # Vulnerability Scanning and Fixing
    - name: Scan Python vulnerabilities with Bandit
      run: |
        bandit -r pyguizer -f json -o bandit-results.json || true
    
    - name: Fix Python code quality issues
      run: |
        # Fix import ordering
        isort pyguizer tests
        # Fix formatting
        black pyguizer tests
        # Remove unused imports and variables
        autoflake --remove-all-unused-imports --remove-unused-variables --in-place -r pyguizer tests
    
    # Frontend Code Quality
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Scan frontend vulnerabilities with npm audit
      run: |
        cd frontend
        npm audit --audit-level=moderate || true
    
    - name: Fix frontend code quality issues
      run: |
        cd frontend
        npm run lint -- --fix
    
    # Auto-commit fixes if on pull request
    - name: Auto-commit code quality fixes
      if: github.event_name == 'pull_request'
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: 'Auto-fix code quality issues'
        file_pattern: '*.py *.ts *.tsx'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12]
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Lint with flake8 (final check)
      run: |
        flake8 pyguizer tests
    
    - name: Check formatting with black (final check)
      run: |
        black --check pyguizer tests
    
    - name: Check import ordering with isort (final check)
      run: |
        isort --check pyguizer tests
    
    - name: Run unit tests
      run: |
        pytest tests/test_*.py -v -k "not integration" --cov=pyguizer --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        pytest tests/test_*_integration.py tests/test_api_integration.py -v --cov=pyguizer --cov-report=xml --cov-report=term-missing --cov-append
    
    - name: Run regression tests
      run: |
        pytest tests/test_regression.py -v --cov=pyguizer --cov-report=xml --cov-report=term-missing --cov-append
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests,integration,regression
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend unit tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --testPathPattern=\.test\.(ts|tsx)$
    
    - name: Run frontend integration tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --testPathPattern=integration\.test\.tsx$ --coverage-append
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Build Python package
      run: |
        python -m build

  deploy-demo:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build frontend for demo
      run: |
        cd frontend
        npm run build
    
    - name: Deploy frontend demo to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/dist
        publish_branch: gh-pages

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload dist/*
