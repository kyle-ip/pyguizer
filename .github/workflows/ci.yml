# CI/CD Pipeline: vulnerabilities, refactoring, tests, deploy
# - Automatically fix code vulnerabilities (Bandit, pip-audit, npm audit)
# - Refactor poor-quality code (PyLint, ESLint, black, isort, autoflake)
# - Run unit, integration, and regression tests
# - Deploy demos to GitHub Pages

name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/automation]
  pull_request:
    branches: [main, feat/automation]
  schedule:
    - cron: "0 0 * * 0"  # Weekly vulnerability scan

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  PYLINT_FAIL_UNDER: "8.0"

jobs:
  # ─── Security: vulnerability scanning and auto-fix ────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: Install Python dependencies with Poetry
        run: |
          poetry install --with dev

      - name: Install pip-audit for dependency scanning
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip-audit --desc 2>&1 | tee pip-audit.log || true
          if pip-audit 2>/dev/null; then
            echo "pip-audit: no known vulnerabilities"
          else
            echo "pip-audit: vulnerabilities found; run 'pip-audit --fix' or 'poetry update' locally"
          fi

      - name: Fix Python dependency vulnerabilities (pip-audit)
        run: |
          pip-audit --fix 2>&1 || true

      - name: Scan Python code for vulnerabilities (Bandit)
        run: |
          poetry run bandit -r pyguizer examples -f json -o bandit-results.json 2>/dev/null || true
          poetry run bandit -r pyguizer examples -ll 2>&1 | tee bandit.log || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Audit frontend dependencies (npm audit)
        run: |
          cd frontend && npm audit --audit-level=moderate 2>&1 | tee ../npm-audit.log || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-results.json
            bandit.log
            pip-audit.log
            npm-audit.log
          if-no-files-found: ignore

  # ─── Code quality: refactor with PyLint, ESLint, black, isort, autoflake ───
  code-quality:
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: Install Python dependencies with Poetry
        run: |
          poetry install --with dev

      - name: Fix Python code quality (isort, black, autoflake)
        run: |
          poetry run isort pyguizer tests examples
          poetry run black pyguizer tests examples
          poetry run autoflake --remove-all-unused-imports --remove-unused-variables --in-place -r pyguizer tests examples

      - name: Run PyLint (refactor / quality check)
        run: |
          poetry run pylint pyguizer tests examples --output-format=text --fail-under=${{ env.PYLINT_FAIL_UNDER }} 2>&1 | tee pylint.log || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Fix frontend dependency vulnerabilities (npm audit fix)
        run: |
          cd frontend && npm audit fix 2>&1 || true

      - name: Fix frontend code quality (ESLint)
        run: |
          cd frontend && npm run lint -- --fix 2>&1 || true

      - name: Auto-commit code quality fixes
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix code quality (PyLint, ESLint, black, isort, autoflake, npm audit)"
          file_pattern: "*.py *.ts *.tsx frontend/package-lock.json"
          branch: ${{ github.head_ref }}

  # ─── Tests: unit, integration, regression ─────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest from PR branch (includes auto-fixes)
        if: github.event_name == 'pull_request' && github.head_ref != ''
        run: |
          git fetch origin ${{ github.head_ref }}
          git checkout origin/${{ github.head_ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: Install Python dependencies with Poetry
        run: |
          poetry install --with dev

      - name: Lint (flake8, black, isort)
        run: |
          poetry run flake8 pyguizer tests
          poetry run black --check pyguizer tests examples
          poetry run isort --check pyguizer tests examples

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend && npm run build

      - name: Run unit tests
        run: |
          poetry run python -m pytest tests/ -v -k "not integration" --ignore=tests/test_regression.py --ignore=tests/test_api_integration.py --ignore=tests/test_cli.py --ignore=tests/test_core.py --ignore=tests/test_new_features.py --ignore=tests/verify_core.py --cov=pyguizer --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: |
          poetry run python -m pytest tests/test_api_integration.py -v -m integration --cov=pyguizer --cov-report=xml --cov-report=term-missing --cov-append

      - name: Run regression tests
        run: |
          poetry run python -m pytest tests/test_regression.py -v --cov=pyguizer --cov-report=xml --cov-report=term-missing --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests,integration,regression
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Run frontend unit tests
        run: |
          cd frontend && npm test -- --coverage --watchAll=false --testPathPatterns="\.test\.(ts|tsx)$" --testPathIgnorePattern="integration"

      - name: Run frontend integration tests
        run: |
          cd frontend && npm test -- --coverage --watchAll=false --testPathPatterns="integration\.test\.(ts|tsx)$"

      - name: Build Python package
        run: |
          poetry build

  # ─── Deploy demos to GitHub Pages ─────────────────────────────────────────
  deploy-demo:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/automation')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Build frontend for demo
        run: |
          cd frontend && npm run build

      - name: Prepare demos page (examples + run instructions)
        run: |
          mkdir -p frontend/build/demos
          cp -r examples frontend/build/demos/
          cp scripts/demos-index.html frontend/build/demos/index.html

      - name: Deploy frontend demo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          publish_branch: gh-pages

  # ─── Publish to PyPI (main only) ──────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: Build package
        run: |
          poetry build

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PASSWORD }}
        run: |
          poetry publish --build --skip-existing
