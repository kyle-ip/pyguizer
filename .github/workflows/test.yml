# Quick validate: lint + unit tests for fast feedback (e.g. on feat/automation).
# Full pipeline (security, refactor, integration/regression, deploy) runs in ci.yml.

name: Quick Validate

on:
  push:
    branches: [feat/automation]
  pull_request:
    branches: [feat/automation]

jobs:
  quick-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" isort bandit autoflake pylint black flake8 flake8-pyproject pytest-cov

      - name: Lint (flake8, black, isort)
        run: |
          flake8 pyguizer tests
          black --check pyguizer tests examples
          isort --check pyguizer tests examples

      - name: Run unit tests (fast, stop on first fail)
        run: |
          python -m pytest tests/ -v -x -k "not integration" --ignore=tests/test_regression.py --ignore=tests/test_api_integration.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend && npm test -- --watchAll=false --testPathPattern="\.test\.(ts|tsx)$" --testPathIgnorePattern="integration"
