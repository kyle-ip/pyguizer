# Quick validate: lint + unit tests for fast feedback (e.g. on feat/automation).
# Full pipeline (security, refactor, integration/regression, deploy) runs in ci.yml.

name: Quick Validate

on:
  push:
    branches: [main, feat/test_automation]
  pull_request:
    branches: [main, feat/test_automation]

jobs:
  quick-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry --version

      - name: Install Python dependencies with Poetry
        run: |
          poetry install --with dev

      - name: Lint (flake8, black, isort)
        run: |
          poetry run flake8 pyguizer tests
          poetry run black --check pyguizer tests
          poetry run isort --check pyguizer tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend && npm run build

      - name: Run unit tests (fast, stop on first fail)
        run: |
          poetry run python -m pytest tests/ -v -x -k "not integration" --ignore=tests/test_regression.py --ignore=tests/test_api_integration.py --ignore=tests/test_cli.py --ignore=tests/test_core.py --ignore=tests/test_new_features.py --ignore=tests/verify_core.py -q

      # - name: Run frontend unit tests
      #   run: |
      #     cd frontend && npm test -- --watchAll=false --testPathIgnorePatterns="integration"

