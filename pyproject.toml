[tool.poetry]
name = "pyguizer"
version = "0.1.0"
description = "Automatic Web GUI Generator for Python Functions"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "pyguizer"}]
homepage = "https://github.com/yourusername/pyguizer"
repository = "https://github.com/yourusername/pyguizer"
license = "MIT"
keywords = ["gui", "web", "python", "fastapi", "automatic", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Development Status :: 3 - Alpha"
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
pydantic = "^2.5.2"
typer = "^0.9.0"
uvicorn = "^0.24.0"
aiohttp = "^3.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
flake8-pyproject = "^1.2.3"  # Enable flake8 to read pyproject.toml config
httpx = "^0.25.2"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.21.1"  # For testing async functions
bandit = "^1.7.5"  # Vulnerability scanning
autoflake = "^2.2.2"  # Auto-fix unused imports
pylint = "^3.0.0"  # Code quality analysis

[tool.poetry.scripts]
pyguizer = "pyguizer.__main__:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(\.
    |build
    |dist
    |venv
    |__pycache__
    |frontend
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = ["venv", "__pycache__", "build", "dist", "frontend"]

[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", "build", "dist", "venv", "frontend"]
extend-ignore = ["E203", "W503", "F541"]  # Ignore black-related formatting issues and f-string without placeholders
select = ["E", "F", "W", "C90"]
